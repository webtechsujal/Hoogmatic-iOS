name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App for iPhone Device
        run: |
          xcodebuild -project Hoogmatic.xcodeproj \
                     -scheme Hoogmatic \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build_device \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package App for Diawi
        run: |
          mkdir -p Payload
          cp -r build_device/Build/Products/Release-iphoneos/Hoogmatic.app Payload/
          zip -r Hoogmatic-Diawi.zip Payload/

      - name: Upload Diawi Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoogmatic-Diawi
          path: Hoogmatic-Diawi.zip
