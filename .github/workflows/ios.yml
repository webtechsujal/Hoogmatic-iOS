name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App (.app Bundle)
        run: |
          xcodebuild -project Hoogmatic.xcodeproj \
                     -scheme Hoogmatic \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package App for Diawi
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphonesimulator/Hoogmatic.app Payload/
          zip -r Hoogmatic-iOS-App.zip Payload/

      - name: Upload Compiled iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoogmatic-iOS-App
          path: Hoogmatic-iOS-App.zip
