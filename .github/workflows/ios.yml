name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App (.app Bundle)
        run: |
          xcodebuild -project Hoogmatic.xcodeproj \
                     -scheme Hoogmatic \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package Hoogmatic.app at root
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../Hoogmatic-App-Root.zip Hoogmatic.app

      - name: Upload iOS App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoogmatic-App-Root
          path: Hoogmatic-App-Root.zip
